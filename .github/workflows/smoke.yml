name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # JANGAN tambahkan `|| true`: kegagalan `vir smoke` harus menggagalkan CI
      # (PRD F1.8). Pipeline penuh (BPE→VQ→generator→decoder→sampling + overfit
      # 8 sampel) disiapkan model-eng/bind-eng; perintah ini yang menjalankannya.
      - run: cargo run -p vir-cli -- smoke --json