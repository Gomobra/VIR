name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  nextest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # Bangun binari `vir` agar uji e2e menemukannya.
      - run: cargo build -p vir-cli
      # TANPA `--no-tests=pass`: nextest keluar dengan kode 4 bila tidak ada tes
      # yang dijalankan (F0.2 tugas 3). Jangan hidupkan kembali flag ini.
      - run: cargo nextest run --workspace

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # Jalur `tests/e2e` (F1.8): menjalankan `vir smoke --json` nyata dan
      # memvalidasi skema + gerbang G1 lewat crate `vir-e2e`.
      - run: cargo build -p vir-cli
      - run: cargo nextest run --manifest-path tests/e2e/Cargo.toml
        env:
          VIR_E2E_REQUIRE_BIN: "1"

  forbid_stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/forbid_stubs.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses bans sources

  vir-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: vir-sandbox
      # Tes CPU bawaan (tanpa fitur): `Policy`, `ResourceLimits`, perakitan
      # `Command`, `run`/`spawn` dengan rlimit + timeout, dan kebijakan
      # allowlist syscall. Job `nextest` juga menjalankannya; langkah ini
      # membuat kegagalan crate terlihat langsung pada jobnya sendiri.
      - run: cargo test -p vir-sandbox
      # Kode konfinemen kernel (Landlock + seccomp) wajib tetap kompilasi dan
      # lolos clippy di Linux walau tidak dijalankan di job ini.
      # `cargo test --features sandbox` sengaja tidak dipasang: dengan filter
      # seccomp aktif, program uji (mis. `/bin/sh`) bergantung pada allowlist
      # yang diaudit terhadap kernel nyata (F3.1 butir 7, `tests/isolation.rs`).
      - run: cargo clippy -p vir-sandbox --all-targets --features sandbox -- -D warnings
      - run: cargo build -p vir-sandbox --features sandbox

  vir-vq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path crates/vir-vq/Cargo.toml
      - run: cargo test --manifest-path crates/vir-vq/Cargo.toml
      - run: cargo build --manifest-path crates/vir-vq/Cargo.toml --features fused

  vir-nn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path crates/vir-nn/Cargo.toml
      - run: cargo test --manifest-path crates/vir-nn/Cargo.toml

  vir-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path crates/vir-model/Cargo.toml
      - run: cargo test --manifest-path crates/vir-model/Cargo.toml

  vir-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path crates/vir-train/Cargo.toml
      - run: cargo test --manifest-path crates/vir-train/Cargo.toml

  vir-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path crates/vir-eval/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/vir-eval/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path crates/vir-eval/Cargo.toml
      - run: cargo test --manifest-path crates/vir-eval/Cargo.toml

  vir-modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path crates/vir-modal/Cargo.toml
      - run: cargo test --manifest-path crates/vir-modal/Cargo.toml