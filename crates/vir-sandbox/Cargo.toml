[package]
name = "vir-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vir-common = { path = "../vir-common" }
libc = "0.2"
nix = { version = "0.29", features = ["resource", "process", "signal"] }
landlock = { version = "0.4", optional = true }
seccompiler = { version = "0.4", optional = true }

# Biner bantuan `vir-iso` (proses dengan perilaku yang dapat dipicu tepat:
# spin/alloc/fork/write/net/bad-syscall). `required-features` di bawah membuat
# Cargo hanya membangunnya saat fitur ini aktif, sehingga job `nextest` tanpa
# fitur tidak menyalakan `CARGO_BIN_EXE_vir-iso`.
[[bin]]
name = "vir-iso"
path = "src/bin/vir-iso.rs"
required-features = ["iso-helper"]

[features]
default = []
# Konfinemen kernel: Landlock (filesystem/jaringan) + seccomp-bpf allowlist.
sandbox = ["dep:landlock", "dep:seccompiler"]
# Biner bantuan `vir-iso` untuk `tests/isolation.rs`; job `vir-sandbox` memakai
# `--features sandbox,iso-helper`.
iso-helper = []