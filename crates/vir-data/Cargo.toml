[package]
name = "vir-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vir-common = { path = "../vir-common" }
vir-text = { path = "../vir-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Kompresi blok shard (PRD F1.3). Tanpa default features: hanya perpustakaan
# streaming yang dipakai, tanpa pengiklat C tambahan (legacy/zdict).
zstd = { version = "0.13", default-features = false, features = ["arrays"] }

[dev-dependencies]
proptest = "1"