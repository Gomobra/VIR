[package]
name = "vir-train"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
vir-common = { path = "../vir-common" }
vir-model = { path = "../vir-model" }
burn = { version = "0.22", default-features = false, features = ["flex", "autodiff", "std", "train", "autotune", "fusion", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[workspace]

[features]
default = []
cuda = ["burn/cuda"]
